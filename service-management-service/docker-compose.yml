version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: service-management-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: service_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d service_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: service-management-api
    environment:
      DATABASE_URL: postgresql+psycopg://user:password@db:5432/service_management
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app

volumes:
  postgres_data:

networks:
  default:
    name: service-management-network
